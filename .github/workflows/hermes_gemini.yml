name: A股盘面AI智能诊断看板 (Gemini 3.6 Flash)

on:
  schedule:
    # 北京时间交易日 10:00, 11:00, 12:00, 14:00, 15:00 (整点数据快照)
    - cron: '0 2,3,4,6,7 * * 1-5'
    # 北京时间 11:45 (午盘点评)
    - cron: '45 3 * * 1-5'
    # 北京时间 15:15 (收盘点评)
    - cron: '15 7 * * 1-5'
    # 北京时间 16:30 (复盘点评)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-hermes-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Hermes Agent & Financial Skill
        run: |
          python -m pip install --upgrade pip
          pip install hermes-agent
          npx skills add HiThink-Tech/Financial-API --skill hithink-finance -g --yes

      - name: 运行 Hermes (基于 Gemini 3.6 Flash 生成分析)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          # 1. 获取当前 UTC 时间节点
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)

          # 2. 根据时间类型触发不同 Prompt
          if [ "$HOUR" "==" "03" ] && [ "$MINUTE" "==" "45" ]; then
            TYPE="noon"
            PROMPT="抓取午盘行情，评估综合/情绪/量比评分，撰写午盘深度点评，将结构化数据和点评更新至 data.json 中的 hourly_snapshots 和 reports.noon 节点。"
          elif [ "$HOUR" "==" "07" ] && [ "$MINUTE" "==" "15" ]; then
            TYPE="close"
            PROMPT="抓取收盘行情，更新全天评分指标，撰写收盘点评，更新 data.json 中的 hourly_snapshots 和 reports.close 节点。"
          elif [ "$HOUR" "==" "08" ] && [ "$MINUTE" "==" "30" ]; then
            TYPE="review"
            PROMPT="抓取龙虎榜与板块轮动，撰写盘后复盘策略，更新 data.json 中的 reports.review 节点。"
          else
            TYPE="snapshot"
            PROMPT="抓取当前整点行情，计算综合评分、情绪评分、量比评分并总结一句话点评，插入到 data.json 的 hourly_snapshots 数组中。"
          fi

          # 3. 如果遭遇限流，最多重试 3 次，每次间隔 10 秒
          n=0
          until [ "$n" -ge 3 ]
          do
             hermes -m "gemini-3.6-flash" -z "$PROMPT" && break
             n=$((n+1))
             echo "遭遇 API 限流，等待 10 秒后重试 ($n/3)..."
             sleep 10
          done

      - name: 提交并推送 data.json 变更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "auto: update market analysis data ($TYPE)" || echo "No changes to commit"
          git push

      - name: 部署至 GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
