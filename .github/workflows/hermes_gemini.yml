name: A股盘面AI智能诊断看板

on:
  schedule:
    # 北京时间交易日 10:00, 11:00, 12:00, 14:00, 15:00 (整点数据快照)
    - cron: '0 2,3,4,6,7 * * 1-5'
    # 北京时间 11:45 (午盘点评)
    - cron: '45 3 * * 1-5'
    # 北京时间 15:15 (收盘点评)
    - cron: '15 7 * * 1-5'
    # 北京时间 16:30 (复盘点评)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-hermes:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Hermes Agent & Financial Skill
        run: |
          python -m pip install --upgrade pip
          pip install hermes-agent
          npx skills add HiThink-Tech/Financial-API --skill hithink-finance -g --yes

      - name: 运行 Hermes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          # 1. 强制设定时区为北京时间 (UTC+8)
          export TZ="Asia/Shanghai"
          
          # 2. 获取北京时间的准确日期和时间
          TODAY=$(date "+%Y-%m-%d")
          HOUR=$(date "+%H")
          MINUTE=$(date "+%M")

          # 确保 data 归档目录存在
          mkdir -p data

          echo "当前北京时间: $TODAY $HOUR:$MINUTE"

          # 3. 带日期归档逻辑的 Prompt
          ARCHIVE_INSTRUCTION="注意：更新数据时，请同时覆盖跟目录的 data.json，并同步保存一份完整的当日数据到 data/$TODAY.json 文件中。"

          if [ "$HOUR" "==" "11" ] && [ "$MINUTE" "==" "45" ]; then
            TYPE="noon"
            PROMPT="今天是 $TODAY。请抓取今天午盘行情，评估综合/情绪/量比评分，撰写午盘深度点评，将结构化数据和点评更新至 data.json 中的 hourly_snapshots 和 reports.noon 节点。$ARCHIVE_INSTRUCTION"
          elif [ "$HOUR" "==" "15" ] && [ "$MINUTE" "==" "15" ]; then
            TYPE="close"
            PROMPT="抓取今天是 $TODAY 的收盘行情，更新全天评分指标，撰写收盘点评，更新 data.json 中的 hourly_snapshots 和 reports.close 节点。$ARCHIVE_INSTRUCTION"
          elif [ "$HOUR" "==" "16" ] && [ "$MINUTE" "==" "30" ]; then
            TYPE="review"
            PROMPT="抓取今天是 $TODAY 的龙虎榜与板块轮动，撰写盘后复盘策略，更新 data.json 中的 reports.review 节点。$ARCHIVE_INSTRUCTION"
          else
            TYPE="snapshot"
            PROMPT="今天是 $TODAY。请抓取当前整点行情（时间：$TODAY $HOUR:00），计算综合评分、情绪评分、量比评分并总结一句话点评，插入到 data.json 的 hourly_snapshots 数组中。$ARCHIVE_INSTRUCTION"
          fi

          # 4. 执行 Agent 任务
          hermes -m "openrouter/free" -z "$PROMPT"

      - name: 提交并推送数据变更 (包含历史归档)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 如果 data.json 不存在，创建一个初始空的
          if [ ! -f "data.json" ]; then
            echo '{"summary_scores":{"overall":"--","sentiment":"--","volume":"--"},"hourly_snapshots":[],"reports":{}}' > data.json
          fi

          # 2. 将变动文件加入暂存区
          git add data.json data/ || true

          # 3. 提交变更（若无变更则平滑跳过）
          git commit -m "auto: update market analysis data ($TYPE) [$(date '+%Y-%m-%d')]" || echo "No changes to commit"
          
          # 4. 推送到远程仓库
          git push

      - name: 部署至 GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
