name: 股票盘面多节点自动点评与看板更新

on:
  schedule:
    # -------------------------------------------------------------
    # 注意：GitHub Actions 使用 UTC 时间 (北京时间 = UTC + 8小时)
    # -------------------------------------------------------------
    # 1. 交易日盘中整点快照 (UTC 2:00, 3:00, 4:00, 6:00, 7:00 => 北京时间 10:00, 11:00, 12:00, 14:00, 15:00)
    - cron: '0 2,3,4,6,7 * * 1-5'

    # 2. 午盘点评 (UTC 03:45 => 北京时间 11:45)
    - cron: '45 3 * * 1-5'

    # 3. 收盘点评 (UTC 07:15 => 北京时间 15:15)
    - cron: '15 7 * * 1-5'

    # 4. 复盘点评 (UTC 08:30 => 北京时间 16:30)
    - cron: '30 8 * * 1-5'

  workflow_dispatch: # 支持手动触发测试

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  hermes-scheduled-task:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Hermes Agent & Skill
        run: |
          curl -fsSL https://raw.githubusercontent.com/hermes-agent/hermes-agent/main/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          npx skills add HiThink-Tech/Financial-API --skill hithink-finance -g --yes

      - name: 根据时间判定并运行 Hermes 指令
        env:
          OPENAI_API_KEY: ${{ secrets.HERMES_MODEL_API_KEY }}
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          # 获取当前 UTC 小时与分钟
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          
          echo "当前运行时间 (UTC): $HOUR:$MINUTE"

          if [ "$HOUR" "==" "03" ] && [ "$MINUTE" "==" "45" ]; then
            echo "==== 执行【午盘点评】任务 ===="
            HERMES_PROMPT="调用同花顺 API 获取上午 A 股收盘数据。重点聚焦上午资金净流入方向、早盘最强主线和炸板风险，撰写 200 字【午盘点评】，计算情绪分并更新 index.html 中的午盘板块。"

          elif [ "$HOUR" "==" "07" ] && [ "$MINUTE" "==" "15" ]; then
            echo "==== 执行【收盘点评】任务 ===="
            HERMES_PROMPT="调用同花顺 API 获取全天收盘行情。重点总结全天涨停天梯、最高连板高度、涨跌停对比及成交量变动，撰写 250 字【收盘点评】，更新情绪分仪表盘并写入 index.html。"

          elif [ "$HOUR" "==" "08" ] && [ "$MINUTE" "==" "30" ]; then
            echo "==== 执行【复盘点评】任务 ===="
            HERMES_PROMPT="调用同花顺 API 抓取盘后龙虎榜及板块轮动数据。深入分析今日主力资金动向与次日推演策略，撰写 300 字深度【复盘点评】，更新 index.html 的复盘专栏。"

          else
            echo "==== 执行【整点快照更新】任务 ===="
            HERMES_PROMPT="调用同花顺 API 抓取当前最新的 A 股分时大盘指数与涨跌家数，更新 index.html 中的实时数据仪表盘和更新时间。"
          fi

          # 执行 Hermes Agent
          hermes run "$HERMES_PROMPT"

      - name: 配置与部署 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包静态页面资源
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 自动发布到 GitHub Pages
        uses: actions/deploy-pages@v4
