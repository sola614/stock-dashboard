name: A股盘面AI智能诊断看板

on:
  schedule:
    # 北京时间交易日 10:00, 11:00, 12:00, 14:00, 15:00 (整点数据快照)
    - cron: '0 2,3,4,6,7 * * 1-5'
    # 北京时间 11:45 (午盘点评)
    - cron: '45 3 * * 1-5'
    # 北京时间 15:15 (收盘点评)
    - cron: '15 7 * * 1-5'
    # 北京时间 16:30 (复盘点评)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-hermes:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Hermes Agent & Financial Skill
        run: |
          python -m pip install --upgrade pip
          pip install hermes-agent
          npx skills add HiThink-Tech/Financial-API --skill hithink-finance -g --yes

      - name: 运行 Hermes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          # 1. 强制设定时区为北京时间 (UTC+8)
          export TZ="Asia/Shanghai"
          TODAY=$(date "+%Y-%m-%d")
          HOUR=$(date "+%H")
          MINUTE=$(date "+%M")

          mkdir -p data
          echo "当前北京时间: $TODAY $HOUR:$MINUTE"

          ARCHIVE_INSTRUCTION="注意：更新数据时，请更新根目录的 data.json，并同步保存/更新一份完整数据到 data/$TODAY.json 文件中。请确保 JSON 输出格式严谨，包含 indices、summary_scores、market_stats、hot_sectors、reports 和 hourly_snapshots 字段。"

          # 2. 判断触发来源与当前时间
          # 如果是手动触发 (workflow_dispatch) 或踩中具体时间点
          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -lt 14 ]; then
            TYPE="noon"
            PROMPT="今天是 $TODAY。请抓取今天最新的 A 股大盘指数、成交量、涨跌家数与主线热点板块。请计算综合/情绪/量比评分，并撰写一段 150 字左右的午盘深度综合点评，更新至 data.json 中的 reports.noon 节点。$ARCHIVE_INSTRUCTION"
          elif [ "$HOUR" -eq 14 ] || [ "$HOUR" -eq 15 ]; then
            TYPE="close"
            PROMPT="今天是 $TODAY。请抓取今天 A 股收盘行情全貌（三大指数、总成交额、涨跌分布）。更新全天评分指标，撰写一段 200 字左右的收盘深度点评，更新至 data.json 中的 reports.close 节点。$ARCHIVE_INSTRUCTION"
          elif [ "$HOUR" -ge 16 ]; then
            TYPE="review"
            PROMPT="今天是 $TODAY。请抓取今天 A 股全天龙虎榜、资金流向与板块轮动情况，撰写盘后复盘策略与后市展望（一段话），更新至 data.json 中的 reports.review 节点。$ARCHIVE_INSTRUCTION"
          else
            # 早盘或非交易时段手动触发，默认生成全天综合复盘
            TYPE="review"
            PROMPT="今天是 $TODAY。请抓取最新的 A 股市场行情数据（三大指数、热点板块、量能变化），评估综合/情绪/量比评分，并在 reports.noon、reports.close 或 reports.review 中撰写一段 200 字深度点评。$ARCHIVE_INSTRUCTION"
          fi

          # 3. 运行 Agent 
          hermes -m "openrouter/free" -z "$PROMPT"

      - name: 提交并推送数据变更 (包含历史归档)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 如果 data.json 不存在，创建一个初始空的
          if [ ! -f "data.json" ]; then
            echo '{"summary_scores":{"overall":"--","sentiment":"--","volume":"--"},"hourly_snapshots":[],"reports":{}}' > data.json
          fi

          # 2. 将变动文件加入暂存区
          git add data.json data/ || true

          # 3. 提交变更（若无变更则平滑跳过）
          git commit -m "auto: update market analysis data ($TYPE) [$(date '+%Y-%m-%d')]" || echo "No changes to commit"
          
          # 4. 推送到远程仓库
          git push

      - name: 部署至 GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
