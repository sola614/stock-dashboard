name: A股盘面AI智能诊断看板

on:
  schedule:
    # 北京时间交易日 10:00, 11:00, 12:00, 14:00, 15:00 (整点数据快照)
    - cron: '8 2,3,4,6,7 * * 1-5'
    # 北京时间 11:45 (午盘点评)
    - cron: '42 3 * * 1-5'
    # 北京时间 15:15 (收盘点评)
    - cron: '18 7 * * 1-5'
    # 北京时间 16:30 (复盘点评)
    - cron: '36 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-hermes:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Hermes Agent & Financial Skill
        run: |
          python -m pip install --upgrade pip
          pip install hermes-agent
          # 1. 安装同花顺技能
          npx skills add HiThink-Tech/Financial-API --skill hithink-finance -g --yes
          # 2. 将 npm/npx 全局 bin 路径注入 PATH，确保 CLI 随时可被系统识别
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

      - name: 运行 Hermes (基于大模型生成盘面分析与点评)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          FUYAO_TOKEN: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          export TZ="Asia/Shanghai"
          TODAY=$(date "+%Y-%m-%d")
          HOUR=$(date "+%H")
          MINUTE=$(date "+%M")

          mkdir -p data
          echo "当前北京时间: $TODAY $HOUR:$MINUTE"

          # 1. 强制数据真实性约束
          STRICT_REQUIREMENT="【数据获取要求】：你必须优先通过 hithink-finance 技能/API 查询今日（$TODAY）真实的 A 股大盘行情（三大指数点位与涨跌幅、涨跌家数、两市总成交额、主线领涨热点板块）。"

          # 2. 强规范化 output 规则 (解决英文输出、非数字评分、冗余调试文本问题)
          OUTPUT_FORMAT_SPEC="【JSON 字段格式严格规范】：
          1. 所有描述性文字（含评分、状态描述、点评等）必须使用纯中文，严禁出现英文单词（如 bearish, risk-off 等）。
          2. summary_scores 中的 overall、sentiment、volume 必须输出 0~100 之间的纯数字评分（如 65、78、82），不要填写文字描述！
          3. market_stats.status_desc 必须是一句简短的中文市场状态（如：'三大指数弱势震荡，成交量平稳'），严禁包含 API 调试/缺失说明等废话！
          4. hourly_snapshots 中的指数数值必须为纯数字（如 13742.55），严禁带有 'approx' 或其他文本前缀！
          5. hot_sectors 保持包含 name 和 chg_pct 的对象数组结构。
          6. 更新根目录 data.json，并同步保存/更新完整的副本至 data/$TODAY.json 中。"

          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -lt 14 ]; then
            TYPE="noon"
            PROMPT="$STRICT_REQUIREMENT\n今天日期是 $TODAY。请抓取最新午盘行情，评估三大维度评分，并在 data.json 的 reports.noon 节点撰写一段 150 字左右的午盘深度综合点评。\n$OUTPUT_FORMAT_SPEC"
          elif [ "$HOUR" -eq 14 ] || [ "$HOUR" -eq 15 ]; then
            TYPE="close"
            PROMPT="$STRICT_REQUIREMENT\n今天日期是 $TODAY。请抓取收盘行情全貌，评估全天三大维度评分，并在 data.json 的 reports.close 节点撰写一段 200 字左右的收盘深度点评。\n$OUTPUT_FORMAT_SPEC"
          else
            TYPE="review"
            PROMPT="$STRICT_REQUIREMENT\n今天日期是 $TODAY。请抓取全天行情与板块轮动情况，评估全天三大维度评分，并在 data.json 的 reports.review 节点撰写盘后复盘策略与后市展望（一段话）。\n$OUTPUT_FORMAT_SPEC"
          fi

          # 3. 执行 Hermes
          hermes -m "openrouter/free" -z "$PROMPT"

      - name: 提交并推送数据变更 (包含历史归档)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 如果 data.json 不存在，创建一个初始空的
          if [ ! -f "data.json" ]; then
            echo '{"summary_scores":{"overall":"--","sentiment":"--","volume":"--"},"hourly_snapshots":[],"reports":{}}' > data.json
          fi

          # 2. 将变动文件加入暂存区
          git add data.json data/ || true

          # 3. 提交变更（若无变更则平滑跳过）
          git commit -m "auto: update market analysis data ($TYPE) [$(date '+%Y-%m-%d')]" || echo "No changes to commit"
          
          # 4. 推送到远程仓库
          git push

      - name: 部署至 GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
