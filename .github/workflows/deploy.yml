name: A股盘面AI智能诊断看板

on:
  schedule:
    # 北京时间交易日 10:00, 11:00, 12:00, 14:00, 15:00 (整点数据快照)
    - cron: '0 2,3,4,6,7 * * 1-5'
    # 北京时间 11:45 (午盘点评)
    - cron: '45 3 * * 1-5'
    # 北京时间 15:15 (收盘点评)
    - cron: '15 7 * * 1-5'
    # 北京时间 16:30 (复盘点评)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-hermes:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Hermes Agent & Financial Skill
        run: |
          python -m pip install --upgrade pip
          pip install hermes-agent
          # 1. 安装同花顺技能
          npx skills add HiThink-Tech/Financial-API --skill hithink-finance -g --yes
          # 2. 将 npm/npx 全局 bin 路径注入 PATH，确保 CLI 随时可被系统识别
          echo "$(npm config get prefix)/bin" >> $GITHUB_PATH

      - name: 运行 Hermes (基于大模型生成盘面分析与点评)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # 3. 同时提供两种常见命名的同花顺 Key 环境变量，确保工具完美读取
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          FUYAO_TOKEN: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          # 强行指定北京时间
          export TZ="Asia/Shanghai"
          TODAY=$(date "+%Y-%m-%d")
          HOUR=$(date "+%H")
          MINUTE=$(date "+%M")

          mkdir -p data
          echo "当前北京时间: $TODAY $HOUR:$MINUTE"

          STRICT_REQUIREMENT="【必须执行】：请优先通过 hithink-finance 工具/API 查询今日（$TODAY）真实的 A 股大盘行情（三大指数点位与涨跌幅、涨跌家数、两市总成交额、主线领涨热点板块）。"

          ARCHIVE_INSTRUCTION="拿到真实行情数据后，请更新根目录的 data.json，并同步保存/更新一份完整数据到 data/$TODAY.json 中。JSON 结构必须严格包含：indices (sh_index, sh_change, sz_index, sz_change, cy_index, cy_change)、summary_scores、market_stats (up_count, down_count, total_volume)、hot_sectors、reports 和 hourly_snapshots 字段。"

          if [ "$HOUR" -ge 11 ] && [ "$HOUR" -lt 14 ]; then
            TYPE="noon"
            PROMPT="$STRICT_REQUIREMENT\n今天日期是 $TODAY。请抓取最新午盘行情，评估综合/情绪/量比评分，并撰写一段 150 字左右的午盘深度综合点评，更新至 data.json 中的 reports.noon 节点。$ARCHIVE_INSTRUCTION"
          elif [ "$HOUR" -eq 14 ] || [ "$HOUR" -eq 15 ]; then
            TYPE="close"
            PROMPT="$STRICT_REQUIREMENT\n今天日期是 $TODAY。请抓取收盘行情全貌，更新全天评分指标，撰写一段 200 字左右的收盘深度点评，更新至 data.json 中的 reports.close 节点。$ARCHIVE_INSTRUCTION"
          else
            TYPE="review"
            PROMPT="$STRICT_REQUIREMENT\n今天日期是 $TODAY。请抓取全天行情与板块轮动情况，撰写盘后复盘策略与后市展望（一段话），更新至 reports.review 节点。$ARCHIVE_INSTRUCTION"
          fi

          # 4. 执行任务
          hermes -m "openrouter/free" -z "$PROMPT"

      - name: 提交并推送数据变更 (包含历史归档)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 如果 data.json 不存在，创建一个初始空的
          if [ ! -f "data.json" ]; then
            echo '{"summary_scores":{"overall":"--","sentiment":"--","volume":"--"},"hourly_snapshots":[],"reports":{}}' > data.json
          fi

          # 2. 将变动文件加入暂存区
          git add data.json data/ || true

          # 3. 提交变更（若无变更则平滑跳过）
          git commit -m "auto: update market analysis data ($TYPE) [$(date '+%Y-%m-%d')]" || echo "No changes to commit"
          
          # 4. 推送到远程仓库
          git push

      - name: 部署至 GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
