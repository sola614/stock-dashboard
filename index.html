<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A股盘面AI智能诊断看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- 顶部导航与日期切换 -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-chart-line text-blue-400 text-2xl"></i>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
          A股盘面AI智能诊断看板
        </h1>
      </div>
      
      <!-- 日期选择器控制区 -->
      <div class="flex items-center gap-3 bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-700">
        <label for="date-select" class="text-sm text-slate-400 flex items-center gap-1.5">
          <i class="fa-regular fa-calendar-days text-slate-400"></i> 查看历史:
        </label>
        <input 
          type="date" 
          id="date-select" 
          class="bg-slate-800 text-slate-200 text-sm px-2 py-1 rounded border border-slate-600 focus:outline-none focus:border-blue-500 cursor-pointer"
        >
        <button 
          id="reset-today-btn" 
          class="text-xs bg-blue-600/80 hover:bg-blue-600 text-white px-2 py-1 rounded transition"
        >
          今天
        </button>
      </div>
    </div>
  </header>

  <!-- 主体内容区域 -->
  <main class="max-w-7xl mx-auto px-4 mt-6">
    
    <!-- 状态提示框 -->
    <div id="status-banner" class="hidden mb-6 p-4 rounded-xl border flex items-center justify-between">
      <span id="status-message" class="text-sm"></span>
    </div>

    <!-- 1. 大盘主要指数实时展示区 -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <!-- 上证指数 -->
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-4 backdrop-blur flex justify-between items-center">
        <div>
          <div class="text-xs text-slate-400">上证指数</div>
          <div id="sh-index" class="text-2xl font-bold font-mono mt-1">--</div>
        </div>
        <div id="sh-change" class="text-right font-mono font-semibold text-lg">--</div>
      </div>
      <!-- 深证成指 -->
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-4 backdrop-blur flex justify-between items-center">
        <div>
          <div class="text-xs text-slate-400">深证成指</div>
          <div id="sz-index" class="text-2xl font-bold font-mono mt-1">--</div>
        </div>
        <div id="sz-change" class="text-right font-mono font-semibold text-lg">--</div>
      </div>
      <!-- 创业板指 -->
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-4 backdrop-blur flex justify-between items-center">
        <div>
          <div class="text-xs text-slate-400">创业板指</div>
          <div id="cy-index" class="text-2xl font-bold font-mono mt-1">--</div>
        </div>
        <div id="cy-change" class="text-right font-mono font-semibold text-lg">--</div>
      </div>
    </section>

    <!-- 3. 核心指标与相关市场数据评分区 -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 backdrop-blur flex flex-col justify-between">
        <div>
          <div class="text-slate-400 text-sm mb-1 flex justify-between">
            <span>大盘综合评分 / 态势</span>
            <i class="fa-solid fa-gauge text-blue-400"></i>
          </div>
          <div id="score-overall" class="text-2xl font-extrabold text-blue-400 mt-2">--</div>
        </div>
        <div class="mt-4 text-xs text-slate-400 border-t border-slate-700/50 pt-2 flex justify-between">
          <span>状态描述:</span>
          <span id="stat-market-fit" class="text-slate-200">--</span>
        </div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 backdrop-blur flex flex-col justify-between">
        <div>
          <div class="text-slate-400 text-sm mb-1 flex justify-between">
            <span>市场情绪指数</span>
            <i class="fa-solid fa-fire text-amber-400"></i>
          </div>
          <div id="score-sentiment" class="text-sm font-medium text-amber-300 leading-snug mt-2">--</div>
        </div>
        <div class="mt-4 text-xs text-slate-400 border-t border-slate-700/50 pt-2 flex justify-between">
          <span>涨/跌家数:</span>
          <span id="stat-up-down" class="text-slate-200">-- / --</span>
        </div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 backdrop-blur flex flex-col justify-between">
        <div>
          <div class="text-slate-400 text-sm mb-1 flex justify-between">
            <span>成交量比评分</span>
            <i class="fa-solid fa-chart-simple text-emerald-400"></i>
          </div>
          <div id="score-volume" class="text-sm font-medium text-emerald-300 leading-snug mt-2">--</div>
        </div>
        <div class="mt-4 text-xs text-slate-400 border-t border-slate-700/50 pt-2 flex justify-between">
          <span>两市成交额:</span>
          <span id="stat-total-volume" class="text-slate-200">--</span>
        </div>
      </div>
    </section>

    <!-- 2. 深度点评（包含指数总结、当前热点、一段话深度点评） -->
    <section class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-6 backdrop-blur mb-6">
      <div class="border-b border-slate-700 mb-4 flex gap-4">
        <button class="tab-btn active border-b-2 border-blue-500 pb-2 font-medium text-blue-400" data-tab="noon">午盘点评</button>
        <button class="tab-btn border-b-2 border-transparent pb-2 font-medium text-slate-400 hover:text-slate-200" data-tab="close">收盘点评</button>
        <button class="tab-btn border-b-2 border-transparent pb-2 font-medium text-slate-400 hover:text-slate-200" data-tab="review">盘后复盘</button>
      </div>

      <!-- 热点板块标签区 -->
      <div class="mb-4 flex flex-wrap items-center gap-2">
        <span class="text-xs text-slate-400"><i class="fa-solid fa-fire-flame-curved text-red-400 mr-1"></i>监控热点/主线板块:</span>
        <div id="hot-sectors" class="flex flex-wrap gap-2">
          <span class="text-xs bg-slate-700 text-slate-400 px-2.5 py-1 rounded-full">无热点数据</span>
        </div>
      </div>
      
      <!-- 一段话深度综合点评 -->
      <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50">
        <h3 class="text-sm font-semibold text-slate-300 mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-brain text-blue-400"></i> AI 深度综合点评
        </h3>
        <p id="report-summary-paragraph" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line">
          数据加载中...
        </p>
      </div>
    </section>

    <!-- 盘中整点快照追踪 -->
    <section class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-6 backdrop-blur">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-200">
        <i class="fa-solid fa-clock text-slate-400"></i> 盘中整点快照追踪
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-700/50 text-slate-400 uppercase text-xs">
            <tr>
              <th class="p-3">时间 / 标签</th>
              <th class="p-3">上证指数</th>
              <th class="p-3">深证成指</th>
              <th class="p-3">创业板指</th>
              <th class="p-3">备注说明</th>
            </tr>
          </thead>
          <tbody id="snapshots-table-body" class="divide-y divide-slate-700/50">
            <tr><td colspan="5" class="p-4 text-center text-slate-500">暂无数据</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    let currentData = null;
    let activeTab = 'review'; // 默认优先展示收盘复盘

    document.addEventListener('DOMContentLoaded', () => {
      const dateInput = document.getElementById('date-select');
      const todayStr = new Date().toISOString().split('T')[0];
      dateInput.max = todayStr;

      dateInput.addEventListener('change', (e) => loadDataByDate(e.target.value));
      document.getElementById('reset-today-btn').addEventListener('click', () => {
        dateInput.value = '';
        loadDataByDate(null);
      });

      setupTabs();
      loadDataByDate(null);
    });

    async function loadDataByDate(selectedDate) {
      const banner = document.getElementById('status-banner');
      const msg = document.getElementById('status-message');
      const fetchUrl = selectedDate ? `data/${selectedDate}.json` : 'data.json';

      try {
        const response = await fetch(`${fetchUrl}?t=${Date.now()}`);
        if (!response.ok) throw new Error(`无法获取 ${selectedDate || '今天'} 的数据`);

        currentData = await response.json();
        
        banner.className = 'mb-6 p-4 rounded-xl border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 flex items-center justify-between';
        msg.textContent = `当前展示数据：${currentData.date || selectedDate || '今天'}`;
        banner.classList.remove('hidden');

        renderMarketIndices();
        renderOverviewAndStats();
        renderReport();
        renderSnapshots();

      } catch (err) {
        console.error(err);
        banner.className = 'mb-6 p-4 rounded-xl border border-amber-500/40 bg-amber-500/10 text-amber-300 flex items-center justify-between';
        msg.textContent = `提示：${selectedDate ? selectedDate + ' 暂无归档数据' : '数据加载失败或尚未生成'}`;
        banner.classList.remove('hidden');
        resetDisplay();
      }
    }

    // 格式化数字和百分比字符串 (安全容错)
    function formatChange(val) {
      if (val === null || val === undefined || val === '--') return { text: '--', isUp: false };
      
      let num = parseFloat(val);
      if (isNaN(num)) {
        let str = String(val);
        return { text: str, isUp: !str.startsWith('-') };
      }

      let isUp = num >= 0;
      let text = (isUp ? '+' : '') + num.toFixed(2) + '%';
      return { text, isUp };
    }

    // 1. 渲染大盘指数
    function renderMarketIndices() {
      if (!currentData || !currentData.indices) {
        setIndexDisplay('sh', '--', null);
        setIndexDisplay('sz', '--', null);
        setIndexDisplay('cy', '--', null);
        return;
      }
      setIndexDisplay('sh', currentData.indices.sh_index, currentData.indices.sh_change);
      setIndexDisplay('sz', currentData.indices.sz_index, currentData.indices.sz_change);
      setIndexDisplay('cy', currentData.indices.cy_index, currentData.indices.cy_change);
    }

    function setIndexDisplay(prefix, val, changeRaw) {
      const valEl = document.getElementById(`${prefix}-index`);
      const changeEl = document.getElementById(`${prefix}-change`);
      
      let numVal = parseFloat(val);
      valEl.textContent = !isNaN(numVal) ? numVal.toFixed(2) : (val ?? '--');

      const { text, isUp } = formatChange(changeRaw);
      changeEl.textContent = text;

      if (changeRaw !== null && changeRaw !== undefined) {
        changeEl.className = `text-right font-mono font-semibold text-lg ${isUp ? 'text-red-400' : 'text-emerald-400'}`;
        valEl.className = `text-2xl font-bold font-mono mt-1 ${isUp ? 'text-red-400' : 'text-emerald-400'}`;
      } else {
        changeEl.className = 'text-right font-mono font-semibold text-lg text-slate-400';
        valEl.className = 'text-2xl font-bold font-mono mt-1 text-slate-100';
      }
    }

    // 3. 渲染评分与对应底层支撑数据
    function renderOverviewAndStats() {
      if (!currentData) return;
      document.getElementById('score-overall').textContent = currentData.summary_scores?.overall ?? '--';
      document.getElementById('score-sentiment').textContent = currentData.summary_scores?.sentiment ?? '--';
      document.getElementById('score-volume').textContent = currentData.summary_scores?.volume ?? '--';

      document.getElementById('stat-market-fit').textContent = currentData.market_stats?.status_desc ?? '正常';
      
      const up = currentData.market_stats?.up_count;
      const down = currentData.market_stats?.down_count;
      document.getElementById('stat-up-down').textContent = (up !== null && down !== null) ? `${up} 涨 / ${down} 跌` : '未暴露数据';

      // 格式化成交额 (如 1764976410000 转换为 1.76 万亿)
      let totVol = currentData.market_stats?.total_volume;
      if (typeof totVol === 'number') {
        if (totVol > 1e12) {
          totVol = (totVol / 1e12).toFixed(2) + ' 万亿元';
        } else if (totVol > 1e8) {
          totVol = (totVol / 1e8).toFixed(2) + ' 亿元';
        }
      }
      document.getElementById('stat-total-volume').textContent = totVol || '--';
    }

    // 2. 渲染深度点评与热点板块对象列表
    function renderReport() {
      const hotContainer = document.getElementById('hot-sectors');
      const paragraphContainer = document.getElementById('report-summary-paragraph');

      if (!currentData) {
        hotContainer.innerHTML = '<span class="text-xs bg-slate-700 text-slate-400 px-2.5 py-1 rounded-full">无数据</span>';
        paragraphContainer.textContent = '暂无点评数据';
        return;
      }

      // 解析同花顺返回的热点板块列表 (对象数组或纯字符串数组)
      const sectors = currentData.hot_sectors || [];
      if (sectors.length > 0) {
        hotContainer.innerHTML = sectors.map(sec => {
          if (typeof sec === 'object' && sec !== null) {
            let chg = parseFloat(sec.chg_pct);
            let isUp = chg >= 0;
            let bgClass = isUp ? 'bg-red-500/20 text-red-300 border-red-500/30' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30';
            return `<span class="text-xs border px-2.5 py-1 rounded-full font-medium ${bgClass}">
              ${sec.name} ${!isNaN(chg) ? (isUp ? '+' : '') + chg.toFixed(2) + '%' : ''}
            </span>`;
          }
          return `<span class="text-xs bg-red-500/20 text-red-300 border border-red-500/30 px-2.5 py-1 rounded-full font-medium">${sec}</span>`;
        }).join('');
      } else {
        hotContainer.innerHTML = '<span class="text-xs bg-slate-700 text-slate-400 px-2.5 py-1 rounded-full">板块轮动分化</span>';
      }

      // 渲染一段话深度综合点评
      const reportObj = currentData.reports?.[activeTab];
      if (typeof reportObj === 'string') {
        paragraphContainer.textContent = reportObj;
      } else if (reportObj?.paragraph) {
        paragraphContainer.textContent = reportObj.paragraph;
      } else {
        paragraphContainer.textContent = '该时间节点的深度点评尚未生成。';
      }
    }

    // 渲染快照列表
    function renderSnapshots() {
      const tbody = document.getElementById('snapshots-table-body');
      tbody.innerHTML = '';

      if (!currentData || !currentData.hourly_snapshots || currentData.hourly_snapshots.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">暂无整点快照数据</td></tr>`;
        return;
      }

      currentData.hourly_snapshots.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-700/30 transition';
        tr.innerHTML = `
          <td class="p-3 font-mono text-slate-300">
            <span class="font-bold">${item.time || '--'}</span> 
            ${item.label ? `<span class="text-xs bg-slate-700 text-slate-400 px-1.5 py-0.5 rounded ml-1">${item.label}</span>` : ''}
          </td>
          <td class="p-3 font-mono text-slate-200">${item.sh ?? '--'}</td>
          <td class="p-3 font-mono text-slate-200">${item.sz ?? '--'}</td>
          <td class="p-3 font-mono text-slate-200">${item.cy ?? '--'}</td>
          <td class="p-3 text-slate-300 text-xs">${item.note || item.comment || '--'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function resetDisplay() {
      setIndexDisplay('sh', '--', null);
      setIndexDisplay('sz', '--', null);
      setIndexDisplay('cy', '--', null);
      document.getElementById('score-overall').textContent = '--';
      document.getElementById('score-sentiment').textContent = '--';
      document.getElementById('score-volume').textContent = '--';
      document.getElementById('stat-market-fit').textContent = '--';
      document.getElementById('stat-up-down').textContent = '-- / --';
      document.getElementById('stat-total-volume').textContent = '--';
      document.getElementById('hot-sectors').innerHTML = '<span class="text-xs bg-slate-700 text-slate-400 px-2.5 py-1 rounded-full">无数据</span>';
      document.getElementById('report-summary-paragraph').textContent = '无可读数据';
      document.getElementById('snapshots-table-body').innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">无数据</td></tr>`;
    }

    function setupTabs() {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.className = 'tab-btn border-b-2 border-transparent pb-2 font-medium text-slate-400 hover:text-slate-200');
          tab.className = 'tab-btn active border-b-2 border-blue-500 pb-2 font-medium text-blue-400';
          activeTab = tab.dataset.tab;
          renderReport();
        });
      });
    }
  </script>
</body>
</html>
