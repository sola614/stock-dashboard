<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A股盘面AI智能诊断看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- 顶部导航与日期切换 -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid me-2 fa-chart-line text-blue-400 text-2xl"></i>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
          A股盘面AI智能诊断看板
        </h1>
      </div>
      
      <!-- 日期选择器控制区 -->
      <div class="flex items-center gap-3 bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-700">
        <label for="date-select" class="text-sm text-slate-400 flex items-center gap-1.5">
          <i class="fa-regular fa-calendar-days text-slate-400"></i> 查看历史:
        </label>
        <input 
          type="date" 
          id="date-select" 
          class="bg-slate-800 text-slate-200 text-sm px-2 py-1 rounded border border-slate-600 focus:outline-none focus:border-blue-500 cursor-pointer"
        >
        <button 
          id="reset-today-btn" 
          class="text-xs bg-blue-600/80 hover:bg-blue-600 text-white px-2 py-1 rounded transition"
          title="切回今天最新"
        >
          今天
        </button>
      </div>
    </div>
  </header>

  <!-- 主体内容区域 -->
  <main class="max-w-7xl mx-auto px-4 mt-6">
    
    <!-- 状态提示框 -->
    <div id="status-banner" class="hidden mb-6 p-4 rounded-xl border flex items-center justify-between">
      <span id="status-message" class="text-sm"></span>
    </div>

    <!-- 顶部核心指标看板 -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 backdrop-blur">
        <div class="text-slate-400 text-sm mb-1 flex justify-between">
          <span>大盘综合评分</span>
          <i class="fa-solid fa-gauge text-blue-400"></i>
        </div>
        <div id="score-overall" class="text-3xl font-extrabold text-blue-400">--</div>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 backdrop-blur">
        <div class="text-slate-400 text-sm mb-1 flex justify-between">
          <span>市场情绪指数</span>
          <i class="fa-solid fa-fire text-amber-400"></i>
        </div>
        <div id="score-sentiment" class="text-3xl font-extrabold text-amber-400">--</div>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 backdrop-blur">
        <div class="text-slate-400 text-sm mb-1 flex justify-between">
          <span>成交量比评分</span>
          <i class="fa-solid fa-chart-simple text-emerald-400"></i>
        </div>
        <div id="score-volume" class="text-3xl font-extrabold text-emerald-400">--</div>
      </div>
    </section>

    <!-- 深度报告 Tab 切换区 -->
    <section class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-6 backdrop-blur mb-6">
      <div class="border-b border-slate-700 mb-4 flex gap-4">
        <button class="tab-btn active border-b-2 border-blue-500 pb-2 font-medium text-blue-400" data-tab="noon">午盘点评</button>
        <button class="tab-btn border-b-2 border-transparent pb-2 font-medium text-slate-400 hover:text-slate-200" data-tab="close">收盘点评</button>
        <button class="tab-btn border-b-2 border-transparent pb-2 font-medium text-slate-400 hover:text-slate-200" data-tab="review">盘后复盘</button>
      </div>
      
      <div id="report-content" class="text-slate-300 leading-relaxed min-h-[120px] whitespace-pre-line">
        数据加载中...
      </div>
    </section>

    <!-- 分时行情快照列表 -->
    <section class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-6 backdrop-blur">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-200">
        <i class="fa-solid fa-clock text-slate-400"></i> 盘中整点快照追踪
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-700/50 text-slate-400 uppercase text-xs">
            <tr>
              <th class="p-3">时间</th>
              <th class="p-3">综合评分</th>
              <th class="p-3">情绪评分</th>
              <th class="p-3">量比评分</th>
              <th class="p-3">一句话点评</th>
            </tr>
          </thead>
          <tbody id="snapshots-table-body" class="divide-y divide-slate-700/50">
            <tr><td colspan="5" class="p-4 text-center text-slate-500">暂无数据</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    let currentData = null;
    let activeTab = 'noon';

    // 初始化页面：默认加载当前当天数据，并初始化日期选择器
    document.addEventListener('DOMContentLoaded', () => {
      const dateInput = document.getElementById('date-select');
      const todayStr = new Date().toISOString().split('T')[0];
      dateInput.max = todayStr; // 禁止选择未来日期

      // 绑定事件
      dateInput.addEventListener('change', (e) => loadDataByDate(e.target.value));
      document.getElementById('reset-today-btn').addEventListener('click', () => {
        dateInput.value = '';
        loadDataByDate(null); // 加载根目录 data.json (今天)
      });

      setupTabs();
      loadDataByDate(null); // 默认首次加载
    });

    // 核心数据加载函数
    async function loadDataByDate(selectedDate) {
      const banner = document.getElementById('status-banner');
      const msg = document.getElementById('status-message');
      
      // 决定请求路径
      const fetchUrl = selectedDate ? `data/${selectedDate}.json` : 'data.json';

      try {
        const response = await fetch(`${fetchUrl}?t=${Date.now()}`); // 避免浏览器强缓存
        
        if (!response.ok) {
          throw new Error(`无法获取该日期 (${selectedDate}) 的分析数据`);
        }

        currentData = await response.json();
        
        // 显示加载成功提示
        banner.className = 'mb-6 p-4 rounded-xl border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 flex items-center justify-between';
        msg.textContent = `当前展示数据：${currentData.date || selectedDate || '今天'}`;
        banner.classList.remove('hidden');

        // 渲染视图
        renderOverview();
        renderReport();
        renderSnapshots();

      } catch (err) {
        console.warn(err);
        banner.className = 'mb-6 p-4 rounded-xl border border-amber-500/40 bg-amber-500/10 text-amber-300 flex items-center justify-between';
        msg.textContent = `提示：${selectedDate ? selectedDate + ' 暂无归档数据' : '数据加载失败或尚未生成'}`;
        banner.classList.remove('hidden');

        // 清空展示
        resetDisplay();
      }
    }

    // 渲染评分大卡片
    function renderOverview() {
      if (!currentData) return;
      document.getElementById('score-overall').textContent = currentData.summary_scores?.overall ?? '--';
      document.getElementById('score-sentiment').textContent = currentData.summary_scores?.sentiment ?? '--';
      document.getElementById('score-volume').textContent = currentData.summary_scores?.volume ?? '--';
    }

    // 渲染深度报告
    function renderReport() {
      const reportContainer = document.getElementById('report-content');
      if (!currentData || !currentData.reports) {
        reportContainer.textContent = '暂无深度报告内容';
        return;
      }
      reportContainer.textContent = currentData.reports[activeTab] || '该节点报告尚未生成';
    }

    // 渲染快照表格
    function renderSnapshots() {
      const tbody = document.getElementById('snapshots-table-body');
      tbody.innerHTML = '';

      if (!currentData || !currentData.hourly_snapshots || currentData.hourly_snapshots.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">暂无整点快照数据</td></tr>`;
        return;
      }

      currentData.hourly_snapshots.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-700/30 transition';
        tr.innerHTML = `
          <td class="p-3 font-mono text-slate-300">${item.time || '--'}</td>
          <td class="p-3 font-bold text-blue-400">${item.overall_score ?? '--'}</td>
          <td class="p-3 font-bold text-amber-400">${item.sentiment_score ?? '--'}</td>
          <td class="p-3 font-bold text-emerald-400">${item.volume_score ?? '--'}</td>
          <td class="p-3 text-slate-300">${item.comment || '--'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 重置展示内容
    function resetDisplay() {
      document.getElementById('score-overall').textContent = '--';
      document.getElementById('score-sentiment').textContent = '--';
      document.getElementById('score-volume').textContent = '--';
      document.getElementById('report-content').textContent = '无可读数据';
      document.getElementById('snapshots-table-body').innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">无数据</td></tr>`;
    }

    // Tab 切换逻辑
    function setupTabs() {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => {
            t.className = 'tab-btn border-b-2 border-transparent pb-2 font-medium text-slate-400 hover:text-slate-200';
          });
          tab.className = 'tab-btn active border-b-2 border-blue-500 pb-2 font-medium text-blue-400';
          activeTab = tab.dataset.tab;
          renderReport();
        });
      });
    }
  </script>
</body>
</html>
